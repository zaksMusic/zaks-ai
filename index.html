<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Z — Your AI Assistant</title>

    <meta name="description" content="AI Z - AI Assistant modern dan pintar">
    <meta name="theme-color" content="#0b0f19">

    <link rel="stylesheet" href="style.css">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Security -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- Code Highlight -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">Z</div>
                <span>AI Z</span>
            </div>

            <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar">
                ×
            </button>
        </div>

        <button class="new-chat-btn" id="newChat">
            <span>＋</span>
            <span>New Chat</span>
        </button>

        <div class="history-title">
            Recent chats
        </div>

        <div class="chat-history" id="chatHistory">
            <!-- Riwayat chat akan muncul melalui JavaScript -->
        </div>

        <div class="sidebar-bottom">

            <button class="side-option" id="themeToggle">
                <span>☾</span>
                <span>Dark mode</span>
            </button>

            <div class="ai-status">
                <span class="status-dot"></span>
                <span>AI Z Online</span>
            </div>

        </div>

    </aside>

    <!-- OVERLAY MOBILE -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <button
                class="icon-btn menu-btn"
                id="openSidebar"
                aria-label="Open sidebar"
            >
                ☰
            </button>

            <div class="top-title">
                <strong>AI Z</strong>
                <span>AI Assistant</span>
            </div>

            <div class="online-indicator">
                <span class="status-dot"></span>
                Online
            </div>

        </header>

        <!-- CHAT AREA -->
        <section class="chat-container" id="chatContainer">

            <!-- WELCOME -->
            <div class="welcome" id="welcome">

                <div class="welcome-logo">
                    Z
                </div>

                <h1>
                    Welcome to <span>AI Z</span>
                </h1>

                <p>
                    Your smart AI assistant for questions, ideas,
                    coding, writing, and more.
                </p>

                <!-- SUGGESTIONS -->
                <div class="suggestions">

                    <button class="suggestion" data-prompt="Jelaskan apa itu kecerdasan buatan dengan bahasa sederhana.">
                        <span>💡</span>
                        <div>
                            <strong>Learn something</strong>
                            <small>Explain a topic simply</small>
                        </div>
                    </button>

                    <button class="suggestion" data-prompt="Bantu saya membuat program sederhana.">
                        <span>💻</span>
                        <div>
                            <strong>Write code</strong>
                            <small>Build something with code</small>
                        </div>
                    </button>

                    <button class="suggestion" data-prompt="Berikan saya beberapa ide kreatif untuk sebuah proyek.">
                        <span>✨</span>
                        <div>
                            <strong>Get ideas</strong>
                            <small>Brainstorm creative ideas</small>
                        </div>
                    </button>

                    <button class="suggestion" data-prompt="Bantu saya membuat jadwal belajar yang efektif.">
                        <span>📚</span>
                        <div>
                            <strong>Study help</strong>
                            <small>Learn and understand</small>
                        </div>
                    </button>

                </div>

            </div>

            <!-- MESSAGES -->
            <div class="messages" id="messages"></div>

        </section>

        <!-- INPUT AREA -->
        <div class="input-wrapper">

            <div class="input-box">

                <textarea
                    id="userInput"
                    rows="1"
                    placeholder="Message AI Z..."
                    autocomplete="off"
                ></textarea>

                <div class="input-actions">

                    <button
                        class="input-icon"
                        id="attachBtn"
                        type="button"
                        title="Attach"
                    >
                        ＋
                    </button>

                    <div class="input-right">

                        <span class="shortcut">
                            Enter ↵
                        </span>

                        <button
                            class="send-btn"
                            id="sendBtn"
                            type="button"
                            title="Send message"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </div>

            <div class="input-disclaimer">
                AI Z can make mistakes. Check important information.
            </div>

        </div>

    </main>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
